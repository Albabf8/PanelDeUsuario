<!DOCTYPE html>
<html lang=es>

<head>
    <meta charset=UTF-8>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <link rel=stylesheet href=style.css>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <script type=module src=main.js defer></script>
    <title>Panel de usuario</title>
</head>

<body>
    <main>
        <div class="contenedorInput">
            <form name="formularioRegistro" id="formularioRegistro" class="formulario" action="#" method="post">
                <h1>Registro</h1>
                <input id="nombreUsuarioRegistro" type="text" placeholder="Usuario" required>
                <small></small>
                <input id="contraseniaRegistro" type="password" placeholder="Contraseña" required>
                <small></small>
                <i class='bx bx-eye'></i>
                <input id="telefono" type="tel" placeholder="Teléfono" required>
                <small></small>
                <input id="codigoPostal" type="number" placeholder="Código postal" required>
                <small></small>
                <label for="mayorEdad">Soy mayor de edad</label>
                <input type="checkbox" id="mayorEdad" value="mayorEdad">

                <div id="contenedorEdad">
                <input id="edad" type="number" placeholder="Edad">
                <small></small>
                </div>
                
                <button id="botonRegistro" type="submit">Crear cuenta</button>
                <a id="enlaceInicioSesion">¿Ya tienes cuenta? Inicia sesión</a>
            </form>
        </div>
    </main>
</body>
</html>
